# Сборка и публикация мини-аппа на GitHub Pages.
#
# Telegram открывает Mini App только по HTTPS — Pages его даёт бесплатно и
# сам, поэтому ни домена, ни сертификата на нашей стороне не нужно. Сервер
# при этом ничего не хостит: на нём живёт только API бота.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Две сборки подряд не должны наступать друг другу на пятки: публикуется
# последняя, предыдущая отменяется.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Имя репозитория подставляется само: переименуют — путь к ассетам
      # останется верным, править конфиг не придётся.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
